<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: bold; fill: #1a1a1a; }
      .subtitle { font-size: 13px; fill: #666; }
      .box-title { font-size: 12px; font-weight: bold; fill: white; }
      .box-text { font-size: 10px; fill: white; }
      .label { font-size: 10px; fill: #333; }
      .arrow { stroke: #4a89c4; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a89c4" />
    </marker>
    <linearGradient id="securityGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#50c878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3da85f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="35" class="title" text-anchor="middle">OPGPU Security Profile Enforcement</text>
  <text x="700" y="55" class="subtitle" text-anchor="middle">Adaptive Security Based on Photonic Module Type</text>
  
  <!-- Module Detection Flow -->
  <rect x="50" y="80" width="350" height="280" rx="8" fill="#4a90e2" stroke="#2c5aa0" stroke-width="2"/>
  <text x="225" y="110" class="box-title" text-anchor="middle" font-size="14">1. Module Detection</text>
  
  <rect x="70" y="130" width="310" height="50" rx="4" fill="#5b9bd5"/>
  <text x="225" y="150" class="box-text" text-anchor="middle">Module Connected to Fiber</text>
  <text x="225" y="168" class="box-text" text-anchor="middle">Optical/Electrical Sensor Detects</text>
  
  <rect x="70" y="190" width="310" height="50" rx="4" fill="#5b9bd5"/>
  <text x="225" y="210" class="box-text" text-anchor="middle">Read Module EEPROM</text>
  <text x="225" y="228" class="box-text" text-anchor="middle">Type, Capabilities, Calibration</text>
  
  <rect x="70" y="250" width="310" height="50" rx="4" fill="#5b9bd5"/>
  <text x="225" y="270" class="box-text" text-anchor="middle">Load Strategy Profile</text>
  <text x="225" y="288" class="box-text" text-anchor="middle">H3/G3/G2/H1/H4 Configuration</text>
  
  <rect x="70" y="310" width="310" height="40" rx="4" fill="#5b9bd5"/>
  <text x="225" y="333" class="box-text" text-anchor="middle">Notify Host via OpenCL</text>
  
  <!-- Security Profiles -->
  <rect x="430" y="80" width="520" height="500" rx="8" fill="url(#securityGrad)" stroke="#3da85f" stroke-width="2"/>
  <text x="690" y="110" class="box-title" text-anchor="middle" font-size="14">2. Adaptive Security Profiles</text>
  
  <!-- H3 PCM Profile -->
  <rect x="450" y="130" width="240" height="100" rx="5" fill="#3da85f" stroke="#2d8a4e" stroke-width="1.5"/>
  <text x="570" y="152" class="box-text" text-anchor="middle" font-size="11">H3 Open WDM-PCM</text>
  <text x="570" y="172" class="box-text" text-anchor="middle" font-size="9">• Thermal Isolation</text>
  <text x="570" y="188" class="box-text" text-anchor="middle" font-size="9">• Duty-cycle Limit 0.5-1.0</text>
  <text x="570" y="204" class="box-text" text-anchor="middle" font-size="9">• Wear-leveling Mandatory</text>
  <text x="570" y="220" class="box-text" text-anchor="middle" font-size="9">• AES-256-XTS Encryption</text>
  
  <!-- G2 EO Profile -->
  <rect x="700" y="130" width="230" height="100" rx="5" fill="#3da85f" stroke="#2d8a4e" stroke-width="1.5"/>
  <text x="815" y="152" class="box-text" text-anchor="middle" font-size="11">G2 EO Pure</text>
  <text x="815" y="172" class="box-text" text-anchor="middle" font-size="9">• RF/EO Isolation</text>
  <text x="815" y="188" class="box-text" text-anchor="middle" font-size="9">• Optical Power Limit</text>
  <text x="815" y="204" class="box-text" text-anchor="middle" font-size="9">• Periodic Refresh</text>
  <text x="815" y="220" class="box-text" text-anchor="middle" font-size="9">• No NV Data Storage</text>
  
  <!-- G3 Hybrid Profile -->
  <rect x="450" y="245" width="240" height="100" rx="5" fill="#3da85f" stroke="#2d8a4e" stroke-width="1.5"/>
  <text x="570" y="267" class="box-text" text-anchor="middle" font-size="11">G3 PCM+EO Hybrid</text>
  <text x="570" y="287" class="box-text" text-anchor="middle" font-size="9">• PCM+EO Combination</text>
  <text x="570" y="303" class="box-text" text-anchor="middle" font-size="9">• Thermal+RF Isolation</text>
  <text x="570" y="319" class="box-text" text-anchor="middle" font-size="9">• Coexistent Scheduling</text>
  <text x="570" y="335" class="box-text" text-anchor="middle" font-size="9">• Dual Encryption Modes</text>
  
  <!-- H1 3D Profile -->
  <rect x="700" y="245" width="230" height="100" rx="5" fill="#3da85f" stroke="#2d8a4e" stroke-width="1.5"/>
  <text x="815" y="267" class="box-text" text-anchor="middle" font-size="11">H1 3D NV</text>
  <text x="815" y="287" class="box-text" text-anchor="middle" font-size="9">• Per-plane Power Limit</text>
  <text x="815" y="303" class="box-text" text-anchor="middle" font-size="9">• Alignment Monitoring</text>
  <text x="815" y="319" class="box-text" text-anchor="middle" font-size="9">• Yield-aware Scheduling</text>
  <text x="815" y="335" class="box-text" text-anchor="middle" font-size="9">• Enhanced Attestation</text>
  
  <!-- H4 Advanced 3D Profile -->
  <rect x="450" y="360" width="480" height="100" rx="5" fill="#2d8a4e" stroke="#1d7a3e" stroke-width="2"/>
  <text x="690" y="382" class="box-text" text-anchor="middle" font-size="11">H4 3D Tensor (Highest Security)</text>
  <text x="690" y="402" class="box-text" text-anchor="middle" font-size="9">• Multi-axis Calibration Mandatory</text>
  <text x="690" y="418" class="box-text" text-anchor="middle" font-size="9">• Forced Redundancy (26% area overhead)</text>
  <text x="690" y="434" class="box-text" text-anchor="middle" font-size="9">• Continuous Alignment Verification</text>
  <text x="690" y="450" class="box-text" text-anchor="middle" font-size="9">• Maximum Encryption + Logging</text>
  
  <!-- Security Enforcement Mechanisms -->
  <rect x="980" y="80" width="370" height="500" rx="8" fill="#50c878" stroke="#3da85f" stroke-width="2"/>
  <text x="1165" y="110" class="box-title" text-anchor="middle" font-size="14">3. Security Enforcement</text>
  
  <!-- Thermal Monitoring -->
  <rect x="1000" y="130" width="330" height="70" rx="4" fill="#3da85f"/>
  <text x="1165" y="152" class="box-text" text-anchor="middle" font-size="11">Thermal Monitoring + Interlocks</text>
  <text x="1165" y="170" class="box-text" text-anchor="middle" font-size="9">• Real-time Temperature Sensors</text>
  <text x="1165" y="186" class="box-text" text-anchor="middle" font-size="9">• Automatic Shutdown if T &gt; threshold</text>
  <text x="1165" y="198" class="box-text" text-anchor="middle" font-size="9">• OMCC Thermal Scheduling</text>
  
  <!-- Access Control -->
  <rect x="1000" y="215" width="330" height="70" rx="4" fill="#3da85f"/>
  <text x="1165" y="237" class="box-text" text-anchor="middle" font-size="11">Access Control + Authentication</text>
  <text x="1165" y="255" class="box-text" text-anchor="middle" font-size="9">• Role-based Access (Admin/User/Guest)</text>
  <text x="1165" y="271" class="box-text" text-anchor="middle" font-size="9">• API Token Authentication</text>
  <text x="1165" y="283" class="box-text" text-anchor="middle" font-size="9">• Device Certificate Validation</text>
  
  <!-- Data Encryption -->
  <rect x="1000" y="300" width="330" height="85" rx="4" fill="#3da85f"/>
  <text x="1165" y="322" class="box-text" text-anchor="middle" font-size="11">Data Encryption</text>
  <text x="1165" y="340" class="box-text" text-anchor="middle" font-size="9">• At Rest: AES-256-XTS (M1 PCM)</text>
  <text x="1165" y="356" class="box-text" text-anchor="middle" font-size="9">• In Transit: AES-256-GCM (Optional)</text>
  <text x="1165" y="372" class="box-text" text-anchor="middle" font-size="9">• Key Management: HSM Integration</text>
  <text x="1165" y="385" class="box-text" text-anchor="middle" font-size="9">• Secure Erase on Decommission</text>
  
  <!-- Integrity -->
  <rect x="1000" y="400" width="330" height="85" rx="4" fill="#3da85f"/>
  <text x="1165" y="422" class="box-text" text-anchor="middle" font-size="11">Integrity Verification</text>
  <text x="1165" y="440" class="box-text" text-anchor="middle" font-size="9">• Firmware Signing (RSA-4096)</text>
  <text x="1165" y="456" class="box-text" text-anchor="middle" font-size="9">• Secure OTA Updates + Rollback</text>
  <text x="1165" y="472" class="box-text" text-anchor="middle" font-size="9">• Immutable Audit Logs (Append-only)</text>
  <text x="1165" y="485" class="box-text" text-anchor="middle" font-size="9">• CRC/SHA-256 Checksums</text>
  
  <!-- Availability -->
  <rect x="1000" y="500" width="330" height="70" rx="4" fill="#3da85f"/>
  <text x="1165" y="522" class="box-text" text-anchor="middle" font-size="11">Availability Protection</text>
  <text x="1165" y="540" class="box-text" text-anchor="middle" font-size="9">• Rate Limiting (DoS Prevention)</text>
  <text x="1165" y="556" class="box-text" text-anchor="middle" font-size="9">• Watchdog Timers</text>
  <text x="1165" y="568" class="box-text" text-anchor="middle" font-size="9">• Module Redundancy (Failover)</text>
  
  <!-- Threat Model -->
  <rect x="50" y="400" width="350" height="400" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="225" y="430" class="title" text-anchor="middle" font-size="16">Threat Model</text>
  
  <!-- Threat List -->
  <rect x="70" y="450" width="310" height="40" rx="3" fill="#ff6b6b" stroke="#ee5a5a" stroke-width="1.5"/>
  <text x="225" y="470" class="box-text" text-anchor="middle" font-size="10">S1: Fiber Interception (Low Prob)</text>
  <text x="225" y="484" class="box-text" text-anchor="middle" font-size="9">Mitigation: OTDR Monitoring + Encryption</text>
  
  <rect x="70" y="500" width="310" height="40" rx="3" fill="#ff6b6b" stroke="#ee5a5a" stroke-width="1.5"/>
  <text x="225" y="520" class="box-text" text-anchor="middle" font-size="10">S2: Malicious Light Injection (Low)</text>
  <text x="225" y="534" class="box-text" text-anchor="middle" font-size="9">Mitigation: Optical Isolators + Filters</text>
  
  <rect x="70" y="550" width="310" height="40" rx="3" fill="#ffa500" stroke="#ff8c00" stroke-width="1.5"/>
  <text x="225" y="570" class="box-text" text-anchor="middle" font-size="10">S3: Calibration Manipulation (Med)</text>
  <text x="225" y="584" class="box-text" text-anchor="middle" font-size="9">Mitigation: Signed Firmware + Attestation</text>
  
  <rect x="70" y="600" width="310" height="40" rx="3" fill="#ffa500" stroke="#ff8c00" stroke-width="1.5"/>
  <text x="225" y="620" class="box-text" text-anchor="middle" font-size="10">S6: Firmware Compromise (Med)</text>
  <text x="225" y="634" class="box-text" text-anchor="middle" font-size="9">Mitigation: Secure Boot + SBOM</text>
  
  <rect x="70" y="650" width="310" height="40" rx="3" fill="#ffa500" stroke="#ff8c00" stroke-width="1.5"/>
  <text x="225" y="670" class="box-text" text-anchor="middle" font-size="10">S9: PCIe Vulnerabilities (Med)</text>
  <text x="225" y="684" class="box-text" text-anchor="middle" font-size="9">Mitigation: IOMMU + ATS/PRI</text>
  
  <rect x="70" y="700" width="310" height="40" rx="3" fill="#ffd700" stroke="#ffcc00" stroke-width="1.5"/>
  <text x="225" y="720" class="label" text-anchor="middle" font-size="10" font-weight="bold">S10: AI Model Extraction (Med)</text>
  <text x="225" y="734" class="label" text-anchor="middle" font-size="9">Mitigation: Model Encryption</text>
  
  <!-- Connection Arrows -->
  <line x1="400" y1="220" x2="430" y2="220" class="arrow"/>
  <line x1="950" y1="330" x2="980" y2="330" class="arrow"/>
  
  <!-- Compliance Standards -->
  <rect x="430" y="620" width="520" height="180" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="690" y="650" class="title" text-anchor="middle" font-size="16">Compliance &amp; Certifications</text>
  
  <rect x="450" y="670" width="230" height="50" rx="4" fill="#4a90e2"/>
  <text x="565" y="690" class="box-text" text-anchor="middle" font-size="11">FIPS 140-3</text>
  <text x="565" y="708" class="box-text" text-anchor="middle" font-size="9">Cryptographic Modules</text>
  
  <rect x="700" y="670" width="230" height="50" rx="4" fill="#4a90e2"/>
  <text x="815" y="690" class="box-text" text-anchor="middle" font-size="11">Common Criteria EAL4+</text>
  <text x="815" y="708" class="box-text" text-anchor="middle" font-size="9">Security Evaluation</text>
  
  <rect x="450" y="735" width="230" height="50" rx="4" fill="#4a90e2"/>
  <text x="565" y="755" class="box-text" text-anchor="middle" font-size="11">ISO 27001</text>
  <text x="565" y="773" class="box-text" text-anchor="middle" font-size="9">Information Security</text>
  
  <rect x="700" y="735" width="230" height="50" rx="4" fill="#4a90e2"/>
  <text x="815" y="755" class="box-text" text-anchor="middle" font-size="11">SOC 2 Type II</text>
  <text x="815" y="773" class="box-text" text-anchor="middle" font-size="9">Service Organization Control</text>
  
  <!-- Footer -->
  <text x="700" y="895" class="subtitle" text-anchor="middle">Open Photonic GPU (OPGPU) | CC0 1.0 | 2026-11-19 | github.com/Eremosisima/multilambda-voxel-sim</text>
</svg>
